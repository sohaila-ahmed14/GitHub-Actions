name: Sohila CI pipeline

on:
  workflow_dispatch:

concurrency:
  group: java-maven-pipeline
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    environment:
      name: sohila-ahmed

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'
          cache: maven

      - name: Build JAR
        run: mvn clean package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/java:${{ github.run_number }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/java:${{ github.run_number }} \
                     ${{ secrets.DOCKER_USERNAME }}/java:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/java:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/java:latest

      - name: Checkout CD Repo
        uses: actions/checkout@v4
        with:
          repository: sohaila-ahmed14/CD
          path: cdrepo
          token: ${{ secrets.CD_REPO_TOKEN }}

      - name: Update image tag
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/java:${{ github.run_number }}|" cdrepo/deployment.yaml

      - name: Commit and push changes
        run: |
          cd cdrepo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Update image tag to ${{ github.run_number }}"
          git push
