name: Sohila CI pipeline

on:
  workflow_dispatch:

concurrency:
  group: java-maven-pipeline
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    environment:
      name: sohila-ahmed

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build JAR
        run: mvn clean package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/java:${{ github.run_number }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/java:${{ github.run_number }} \
                     ${{ secrets.DOCKER_USERNAME }}/java:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/java:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/java:latest
